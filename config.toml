baseURL = "/"
themesDir = "themes"
theme = "hugo-serif-theme"
languageCode = "fr-fr"
defaultContentLanguage = "fr"
title = "Full Craft"
publishDir = "docs"
disableKinds = ["taxonomy", "term", "RSS"]

# Contenus retirés du site mais conservés dans le dépôt :
# anciens récits de missions, anciennes pages d'offres, page « À propos » jamais rédigée.
ignoreFiles = ["content/posts/", "content/offers/", "content/about\\.md$"]

[module]
  [module.hugoVersion]
    extended = true
    min = "0.55.0"

[params]
  # In most cases you will only want to set the google_analytics_id OR the google_tag_manager_id. If you have Google Analytics included in your GTM tags don't put your GA ID here. Otherwise your data might be useless.
  google_analytics_id = ""
  google_tag_manager_id = ""

  [params.logo]
    mobile = "images/logo/logo-2.png"
    mobile_height = "36px"
    desktop = "images/logo/logo-2.png"
    desktop_height = "36px"
    alt = "Full Craft"

  [params.fonts]
    # sets the google font link in layouts/partials/google-fonts.html
    google_fonts = 'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Source+Sans+Pro:wght@400;700&display=swap'
    heading = "Playfair Display"
    base = "Source Sans Pro"

  [params.colors]
    primary = "#468556"
    black = "#2f2f41"
    white = "#ffffff"
    white_offset = "#f6f7ff"
    grey = "#5C5A5A"

  [params.footer]
    copyright_text = ''

[menu]
  # Main Menu
  [[menu.main]]
    name = "Accueil"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Équipe"
    url = "/team/"
    weight = 2

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 3

  # Footer Menu
  [[menu.footer]]
    name = "Accueil"
    url = "/"
    weight = 1

  [[menu.footer]]
    name = "Équipe"
    url = "/team/"
    weight = 2

  [[menu.footer]]
    name = "Contact"
    url = "/contact/"
    weight = 3
