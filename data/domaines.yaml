- titre: "Production et pilotage"
  intro: "Des outils de gestion et de suivi : planification, stocks, commandes, suivi d’activité, tableaux de bord."
  exemples:
    - sujet: "Chaîne de production agroalimentaire"
      detail: "comptage par caméra des unités fabriquées."
    - sujet: "Mini-centrales biomasse"
      detail: "suivi en temps réel de quatre centrales dans trois pays."
    - sujet: "Pilotage d’activité"
      detail: "tableaux de bord quotidiens sur la production, les ventes, la casse et les délais."

- titre: "Applications web et mobiles"
  intro: "Des applications web, mobiles et sur tablette, avec leurs serveurs et leurs bases de données, de la création à la reprise d’un existant."
  exemples:
    - sujet: "VTC"
      detail: "refonte et stabilisation des applications mobiles."
    - sujet: "Recharge de véhicules électriques"
      detail: "audit de l’application mobile et plan d’amélioration."
    - sujet: "Suivi médical"
      detail: "application sur tablette et ordinateur."

- titre: "Mesure et systèmes embarqués"
  intro: "Des logiciels au plus près du matériel : acquisition de mesures, temps réel, pilotage d’équipements, vision par caméra."
  exemples:
    - sujet: "Contrôle de radioactivité en industrie"
      detail: "logiciel de mesure pour portails de détection, installé sur 76 sites (PME, grands groupes, hôpitaux)."
    - sujet: "Voilier autonome sans équipage"
      detail: "pilote automatique et détection d’obstacles par caméra."
    - sujet: "Drones professionnels"
      detail: "reprise et refonte de l’application de contrôle."
    - sujet: "Télescopes connectés"
      detail: "algorithmes de repérage et d’identification embarqués dans le produit."
    - sujet: "Bornes de collecte de contenants consignés"
      detail: "paiement par carte bancaire intégré aux bornes."

- titre: "Données, calcul et IA"
  intro: "Collecte et fiabilisation des données, calcul scientifique, optimisation, IA et machine learning."
  exemples:
    - sujet: "Risques hydrologiques"
      detail: "collecte de données et calculs de prévision."
    - sujet: "Points de vente"
      detail: "optimisation du remplissage des rayons."
    - sujet: "Facturation"
      detail: "extraction automatique des données de factures."
    - sujet: "Family office"
      detail: "analyse automatisée de documents financiers par IA."
    - sujet: "Mobilité locale"
      detail: "calcul de temps de trajet à pied, à vélo, en voiture et en transports en commun."
    - sujet: "Trafic routier"
      detail: "moyens de calcul et simulation pour la prédiction du trafic."
