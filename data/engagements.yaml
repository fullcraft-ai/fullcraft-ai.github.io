- titre: "Votre métier d’abord"
  icone: drafting-compass
  texte: "Nous commençons par comprendre votre activité, vos contraintes et vos mots. La technologie vient ensuite, choisie pour vous servir."

- titre: "Une équipe proche"
  icone: handshake
  texte: "Vous échangez directement avec les ingénieurs qui font le travail. Nous restons disponibles, réactifs et présents dans la durée, sans formalisme inutile."

- titre: "À chaque étape"
  icone: route
  texte: "Créer un nouvel outil, reprendre un logiciel existant, l’auditer, le faire évoluer : nous intervenons là où vous en êtes."
