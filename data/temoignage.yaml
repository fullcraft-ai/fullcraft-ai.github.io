citation: "Chez Blue Water Intelligence, le duo Full Craft a réalisé pendant 3 mois un formidable travail de développement, d’architecture, d’optimisation des méthodes, et de coaching de développeurs moins expérimentés. Je vous recommande vivement leurs services, des experts fiables au service de la réussite de vos projets logiciels."
